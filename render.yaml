services:
  - type: web
    name: dao-the-chan-tien-backend
    env: node
    plan: starter
    buildCommand: cd backend && npm install --legacy-peer-deps && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Database (TiDB Cloud)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_SSL
        value: "true"
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: tu-tien-game
      # JWT
      - key: JWT_SECRET
        sync: false
      # Frontend URL (for CORS)
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: dao-the-chan-tien-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
